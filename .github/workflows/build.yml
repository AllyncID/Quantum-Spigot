name: QuantumSpigot build and tests
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"
      - "quantum/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable smoke plugin compilation
        run: echo 'include(":test-plugin")' > test-plugin.settings.gradle.kts
      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --stacktrace
      - name: Build, checks and tests
        run: ./gradlew build test --stacktrace
      - name: Create runnable development jar
        run: ./gradlew createPaperclipJar --stacktrace
      - name: Check local testbench metrics
        run: node --test quantum-testbench/scripts/metrics.test.mjs
      - name: Build native-protocol bot driver
        run: ./gradlew -p quantum-testbench installDist --write-locks --stacktrace
